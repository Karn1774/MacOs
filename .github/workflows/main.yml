name: Temporary macOS Desktop (Chrome RDP)

on:
  workflow_dispatch:

jobs:
  start-macos-desktop:
    runs-on: macos-latest
    steps:
      - name: Install Chrome Remote Desktop on macOS
        run: |
          brew install --cask chrome-remote-desktop-host

      - name: Start macOS Desktop Session
        run: |
          sudo /Library/PrivilegedHelperTools/ChromeRemoteDesktopHost.bundle/Contents/MacOS/remoting_start_host \
            --code="4/0AUn6Hd_eRVohtxdqsNxP-oNsGa7lxfVB9BNiHP-mKzpWgYrlYgCxjwbQ1E_mtPvan0zqgQ" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name="GitHub-MacOS" \
            --pin=123456
          sleep 3600
