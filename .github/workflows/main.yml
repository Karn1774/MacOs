name: Temporary macOS Desktop (Chrome RDP)

on:
  workflow_dispatch:

jobs:
  start-macos-desktop:
    runs-on: macos-latest
    steps:
      - name: Install Chrome Remote Desktop on macOS
        run: |
          brew install --cask chrome-remote-desktop-host

      - name: Start macOS Desktop Session
        run: |
          /Library/PrivilegedHelperTools/ChromeRemoteDesktopHost.app/Contents/MacOS/remoting_start_host \
            --code="4/0AUn6Hd-_oerqn08EnBppI042tQcHc_RdZL2bNFmkLJ3IuIkSNyLskXVDiT3pJxi6shHjUQ" \
            --redirect-url="https://google.com" \
            --name="GitHub-MacOS" \
            --pin=123456
          sleep 3600
