name: Temporary macOS Desktop (RustDesk)

on:
  workflow_dispatch:

jobs:
  start-macos-rustdesk:
    runs-on: macos-latest
    steps:
      - name: Install RustDesk on macOS
        run: |
          brew install --cask rustdesk

      - name: Configure and Start RustDesk
        run: |
          open /Applications/RustDesk.app
          sleep 10
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --install-service
          sleep 5
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --password mypassword
          echo "=== RustDesk ID ==="
          /Applications/RustDesk.app/Contents/MacOS/RustDesk --get-id
          sleep 3600
